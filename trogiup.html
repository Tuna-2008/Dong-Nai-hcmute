<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trogiup</title>
    <style>
        .menu{
            background-color: white;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        .logo img{
            width:200px;
            height:auto;
        }
        .logo{
            margin-right: 0;
        }
        body{
            margin: 0;
        }
        h2{
            color: black;
        }
        a{
            text-decoration: none;
            color:black
        }
        a:hover{
            color:red;
        }
        .ndung{
            text-align: center;
            margin:auto;
        }
        form {
            width: 350px;
            padding: 20px;
            border: 1px solid gray;
            border-radius: 10px;
            margin:50px auto;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="menu">
        <div class="logo">
            <img src="./dulichvanhoa/logo.png" alt="Nhóm 1">
        </div>
        <a href="">🏠</a>
        <a href="">📜Lịch sử</a>
        <a href="">📍Địa lí</a>
        <a href="">💰Kinh tế</a>
        <a href="">🏞️Du lịch văn hóa</a>
        <a href="">🏗️Cơ sở hạ tầng</a>
    </nav>
    <div class="ndung">
        <h1>Mọi thắc mắc đều được giải đáp, mọi góp ý đều được tiếp thu</h1>
        <h2>Gửi câu hỏi</h2>
        <form action="mailto:hungbui6943@gmail.com" method="post" enctype="text/plain">
            <label>Họ và tên:</label><br>
            <input type="text" placeholder="Nhập họ tên"><br><br>
            <label>Email:</label><br>
            <input type="email" placeholder="Nhập email"><br><br>
            <label>Nội dung câu hỏi, góp ý:</label><br>
            <textarea rows="5" cols="30" placeholder="Nhập ý kiến của bạn"></textarea><br><br>
            <button type="submit">Gửi ý kiến</button>
        </form>
    </div>
</body>
</html>
