    <style>
        .menu{
            background-color: white;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        .logo img{
            width:200px;
            height:auto;
        }
        .logo{
            margin-right: 0;
        }
        body{
            margin: 0;
        }
        h2{
            color: black;
        }
        a{
            text-decoration: none;
            color:black
        }
        a:hover{
            color:red;
        }
        .banner {
            width: 55%;
            height: 450px;
            overflow: hidden;
            position: relative;
            margin-top: 5px;
        }
        .slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            animation: slide 12s infinite;
        }
        .slide:nth-child(1) {
            animation-delay: 0s;
        }
        .slide:nth-child(2) {
            animation-delay: 4s;
        }
        .slide:nth-child(3) {
            animation-delay: 8s;
        }
        @keyframes slide {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            30% {
                opacity: 1;
            }
            40% {
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }
		.footer{
            background-color: rgb(29, 119, 194);
            color:white;
            padding:20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }
        .footer-container{
            display:flex;
            justify-content: space-around;
            max-width: 1300px;
            margin:auto;
        }
        .footer-box{
            display:flex;
            flex-direction: column;
            gap: 20px;
        }
        .footer-box h3{
            margin-bottom: 5px;
        }
        .footer-box p{
            margin:0;
        }
        .footer-box a{
            color:white;
            text-decoration: none;
        }
        .footer-box a:hover{
            color:red;
        }
        .footer-bottom{
            text-align: center;
            border-top:1px solid black;
            margin-top:10px;
            padding:10px;
        }
    </style>
</head>
<body>

    </nav>
