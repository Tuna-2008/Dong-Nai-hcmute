        .banner {
            width: 55%;
            height: 450px;
            overflow: hidden;
            position: relative;
            margin-top: 5px;
        }
        .slide {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            animation: slide 12s infinite;
        }
        .slide:nth-child(1) {
            animation-delay: 0s;
        }
        .slide:nth-child(2) {
            animation-delay: 4s;
        }
        .slide:nth-child(3) {
            animation-delay: 8s;
        }
        @keyframes slide {
            0% {
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            30% {
                opacity: 1;
            }
            40% {
                opacity: 0;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
